<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ÉMÌXS — Infinite Mind V4</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
}

#space{
  z-index:0;
}

#universe{
  position:relative;
  width:100%;
  height:100%;
  z-index:2;
}

/* TOP */
.header{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  z-index:5;
  pointer-events:none;
}

.header h1{
  font-size:13px;
  letter-spacing:6px;
  opacity:.75;
}

.header p{
  font-size:9px;
  letter-spacing:3px;
  opacity:.4;
  margin-top:5px;
}

/* CENTRAL CORE */
.core{
  position:absolute;
  left:50%;
  top:50%;
  width:155px;
  height:155px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle,
      #fff 0%,
      #bcbcff 8%,
      #7565ff 20%,
      #26136b 48%,
      #080014 72%,
      transparent 73%);
  box-shadow:
    0 0 25px #8d7cff,
    0 0 70px #614bff,
    0 0 150px #24115e;
  animation:corePulse 3s infinite alternate;
}

.core h2{
  font-size:25px;
  letter-spacing:4px;
}

.core .infinity{
  font-size:35px;
  line-height:35px;
}

.core small{
  font-size:8px;
  letter-spacing:4px;
  opacity:.7;
}

@keyframes corePulse{
  from{
    transform:translate(-50%,-50%) scale(1);
  }
  to{
    transform:translate(-50%,-50%) scale(1.1);
  }
}

/* ORBITS */
.orbit{
  position:absolute;
  left:50%;
  top:50%;
  border:1px solid rgba(150,130,255,.18);
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.orbit1{
  width:300px;
  height:300px;
}

.orbit2{
  width:470px;
  height:470px;
}

.orbit3{
  width:650px;
  height:650px;
}

/* PLANETS */
.planet{
  position:absolute;
  width:88px;
  height:88px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  color:white;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
  z-index:4;
  box-shadow:0 0 20px rgba(130,100,255,.8);
  transition:.25s;
}

.planet:hover{
  transform:scale(1.15);
  box-shadow:
    0 0 25px #fff,
    0 0 60px #745dff;
}

.dreams{
  background:radial-gradient(circle at 30% 25%,#fff,#67a9ff 15%,#29115c 55%,#05000b);
}

.thoughts{
  background:radial-gradient(circle at 30% 25%,#fff,#b76cff 15%,#35105c 55%,#05000b);
}

.emotions{
  background:radial-gradient(circle at 30% 25%,#fff,#ff68a8 15%,#5c103c 55%,#080008);
}

.memories{
  background:radial-gradient(circle at 30% 25%,#fff,#5de0cf 15%,#103d47 55%,#02090b);
}

.creativity{
  background:radial-gradient(circle at 30% 25%,#fff,#ffd35c 15%,#65350b 55%,#090400);
}

.unknown{
  background:radial-gradient(circle at 30% 25%,#fff,#ff45d0 10%,#5a073f 35%,#050008 70%);
  box-shadow:0 0 25px #ff35d0;
}

/* PLANET POSITIONS */
#dreams{
  left:calc(50% - 44px);
  top:calc(50% - 195px);
}

#thoughts{
  left:calc(50% + 155px);
  top:calc(50% - 100px);
}

#emotions{
  left:calc(50% + 90px);
  top:calc(50% + 175px);
}

#memories{
  left:calc(50% - 235px);
  top:calc(50% + 100px);
}

#creativity{
  left:calc(50% - 290px);
  top:calc(50% - 170px);
}

#unknown{
  left:calc(50% - 44px);
  top:calc(50% + 275px);
}

/* CONTROLS */
.controls{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:7px;
  z-index:8;
}

.controls button{
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.65);
  color:#fff;
  border-radius:20px;
  padding:9px 13px;
  cursor:pointer;
}

/* DISCOVER */
.discover{
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  z-index:8;
  border:1px solid #765cff;
  background:rgba(20,10,45,.7);
  color:#fff;
  padding:9px 17px;
  border-radius:25px;
  cursor:pointer;
  box-shadow:0 0 15px #5037cc;
}

/* PANEL */
#panel{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.84);
  backdrop-filter:blur(10px);
}

.panelBox{
  width:min(420px,100%);
  text-align:center;
  padding:30px;
  border:1px solid #765cff;
  border-radius:25px;
  background:linear-gradient(145deg,#12071e,#030309);
  box-shadow:0 0 60px #352080;
}

.panelBox h2{
  font-size:30px;
  letter-spacing:4px;
  margin-bottom:15px;
}

.panelBox p{
  color:#ccc;
  line-height:1.6;
  margin-bottom:22px;
}

.panelBox button{
  border:0;
  border-radius:25px;
  padding:12px 20px;
  background:#7158ff;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin:4px;
}

/* WORLD */
#world{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  background:#020006;
}

#worldCanvas{
  position:absolute;
  inset:0;
}

.back{
  position:absolute;
  top:20px;
  left:20px;
  z-index:5;
  padding:10px 18px;
  border:1px solid #777;
  border-radius:20px;
  background:rgba(0,0,0,.6);
  color:white;
  cursor:pointer;
}

.worldInfo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(500px,90%);
  text-align:center;
  z-index:4;
}

.worldInfo h1{
  font-size:42px;
  letter-spacing:5px;
  text-shadow:0 0 30px #8c7cff;
}

.worldInfo p{
  margin-top:18px;
  color:#ccc;
  line-height:1.7;
}

/* MOBILE */
@media(max-width:600px){

  .planet{
    width:68px;
    height:68px;
    font-size:7px;
  }

  .core{
    width:125px;
    height:125px;
  }

  .core h2{
    font-size:20px;
  }

  .core .infinity{
    font-size:28px;
  }

  .orbit1{
    width:220px;
    height:220px;
  }

  .orbit2{
    width:350px;
    height:350px;
  }

  .orbit3{
    width:480px;
    height:480px;
  }

  #dreams{
    left:calc(50% - 34px);
    top:calc(50% - 145px);
  }

  #thoughts{
    left:calc(50% + 90px);
    top:calc(50% - 65px);
  }

  #emotions{
    left:calc(50% + 55px);
    top:calc(50% + 125px);
  }

  #memories{
    left:calc(50% - 145px);
    top:calc(50% + 80px);
  }

  #creativity{
    left:calc(50% - 170px);
    top:calc(50% - 120px);
  }

  #unknown{
    left:calc(50% - 34px);
    top:calc(50% + 170px);
  }

  .worldInfo h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div id="universe">

  <div class="header">
    <h1>ÉMÌXS — INFINITE MIND</h1>
    <p>A UNIVERSE WITHOUT LIMITS</p>
  </div>

  <button class="discover" onclick="discover()">✦ DISCOVER</button>

  <div class="orbit orbit1"></div>
  <div class="orbit orbit2"></div>
  <div class="orbit orbit3"></div>

  <div class="core">
    <h2>ÉMÌXS</h2>
    <div class="infinity">♾️</div>
    <small>MIND CORE</small>
  </div>

  <button class="planet dreams" id="dreams">DREAMS</button>
  <button class="planet thoughts" id="thoughts">THOUGHTS</button>
  <button class="planet emotions" id="emotions">EMOTIONS</button>
  <button class="planet memories" id="memories">MEMORIES</button>
  <button class="planet creativity" id="creativity">CREATIVITY</button>
  <button class="planet unknown" id="unknown">UNKNOWN</button>

  <div class="controls">
    <button onclick="location.reload()">⌂</button>
    <button onclick="zoomOut()">−</button>
    <button onclick="zoomIn()">+</button>
  </div>

</div>

<div id="panel">

  <div class="panelBox">

    <h2 id="panelTitle"></h2>

    <p id="panelText"></p>

    <button onclick="enterWorld()">ENTER WORLD ♾️</button>

    <button onclick="closePanel()">CLOSE</button>

  </div>

</div>

<div id="world">

  <button class="back" onclick="leaveWorld()">← BACK</button>

  <canvas id="worldCanvas"></canvas>

  <div class="worldInfo">
    <h1 id="worldTitle"></h1>
    <p id="worldText"></p>
  </div>

</div>

<script>

/* =========================
   SPACE
========================= */

const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");

let W,H;
let stars=[];
let shootingStars=[];

function resize(){

  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;

  stars=[];

  for(let i=0;i<220;i++){

    stars.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*1.5,
      speed:Math.random()*.35+.05
    });

  }
}

resize();

addEventListener("resize",resize);

function createShootingStar(){

  shootingStars.push({
    x:Math.random()*W,
    y:Math.random()*H*.5,
    vx:8,
    vy:4,
    life:0
  });

}

setInterval(createShootingStar,3500);

function animateSpace(){

  ctx.fillStyle="rgba(0,0,8,.25)";
  ctx.fillRect(0,0,W,H);

  for(const s of stars){

    s.y+=s.speed;

    if(s.y>H){
      s.y=0;
      s.x=Math.random()*W;
    }

    ctx.globalAlpha=Math.random()*.7+.2;

    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
  }

  for(let i=shootingStars.length-1;i>=0;i--){

    const s=shootingStars[i];

    s.x+=s.vx;
    s.y+=s.vy;
    s.life++;

    ctx.strokeStyle="rgba(255,255,255,.8)";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x-45,s.y-22);
    ctx.stroke();

    if(s.life>25){
      shootingStars.splice(i,1);
    }
  }

  ctx.globalAlpha=1;

  requestAnimationFrame(animateSpace);
}

animateSpace();

/* =========================
   ZOOM
========================= */

let zoom=1;

function zoomIn(){

  zoom=Math.min(1.35,zoom+.1);

  document.getElementById("universe").style.transform=
    `scale(${zoom})`;
}

function zoomOut(){

  zoom=Math.max(.75,zoom-.1);

  document.getElementById("universe").style.transform=
    `scale(${zoom})`;
}

/* =========================
   WORLDS
========================= */

const worlds={

  dreams:{
    title:"DREAMS",
    text:"A place where impossible ideas can become possible."
  },

  thoughts:{
    title:"THOUGHTS",
    text:"Every question, idea and strange thought has a place here."
  },

  emotions:{
    title:"EMOTIONS",
    text:"A world shaped by everything the mind can feel."
  },

  memories:{
    title:"MEMORIES",
    text:"Fragments of moments preserved inside the infinite mind."
  },

  creativity:{
    title:"CREATIVITY",
    text:"Where ideas transform into stories, inventions and entire worlds."
  },

  unknown:{
    title:"THE UNKNOWN",
    text:"A dimension that has not revealed all of its secrets yet."
  }

};

let selected="";

/* =========================
   PLANET CLICK
========================= */

document.querySelectorAll(".planet").forEach(planet=>{

  planet.addEventListener("click",()=>{

    selected=planet.id;

    document.getElementById("panelTitle").textContent=
      worlds[selected].title;

    document.getElementById("panelText").textContent=
      worlds[selected].text;

    document.getElementById("panel").style.display="flex";

  });

});

/* =========================
   PANEL
========================= */

function closePanel(){

  document.getElementById("panel").style.display="none";

}

function enterWorld(){

  document.getElementById("panel").style.display="none";

  document.getElementById("world").style.display="block";

  document.getElementById("worldTitle").textContent=
    worlds[selected].title;

  document.getElementById("worldText").textContent=
    worlds[selected].text;

  startWorld();

}

function leaveWorld(){

  document.getElementById("world").style.display="none";

}

/* =========================
   DISCOVER
========================= */

function discover(){

  const messages=[
    "You discovered a thought hidden inside the universe.",
    "The Infinite Mind has no final boundary.",
    "Some ideas become worlds.",
    "Your imagination is the beginning of the map.",
    "There are still dimensions you haven't discovered."
  ];

  alert(messages[Math.floor(Math.random()*messages.length)]);

}

/* =========================
   WORLD CANVAS
========================= */

const wc=document.getElementById("worldCanvas");
const wctx=wc.getContext("2d");

function resizeWorld(){

  wc.width=innerWidth;
  wc.height=innerHeight;

}

resizeWorld();

addEventListener("resize",resizeWorld);

function startWorld(){

  function animate(){

    if(
      document.getElementById("world").style.display==="none"
    ){
      return;
    }

    wctx.fillStyle="rgba(2,0,8,.2)";
    wctx.fillRect(0,0,wc.width,wc.height);

    const cx=wc.width/2;
    const cy=wc.height/2;

    for(let i=0;i<100;i++){

      const angle=Math.random()*Math.PI*2;
      const distance=Math.random()*Math.min(wc.width,wc.height);

      const x=cx+Math.cos(angle)*distance;
      const y=cy+Math.sin(angle)*distance;

      wctx.fillStyle="rgba(255,255,255,.35)";

      wctx.fillRect(x,y,1,1);

    }

    requestAnimationFrame(animate);

  }

  animate();

}

</script>

</body>
  </html>
