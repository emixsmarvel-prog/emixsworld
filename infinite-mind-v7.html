<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Infinite Mind V7</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#02030b;
    color:white;
}

body{
    position:relative;
}

/* SPACE */

#space{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at center,#17104a 0%,#05051a 35%,#02030b 75%);
}

/* STARS */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
}

/* TITLE */

#title{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:#00eaff;
}

/* UNIVERSE */

#universe{
    position:absolute;
    width:700px;
    height:700px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* ORBITS */

.orbit{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,255,255,.2);
    border-radius:50%;
}

.orbit1{
    width:220px;
    height:220px;
}

.orbit2{
    width:360px;
    height:360px;
}

.orbit3{
    width:500px;
    height:500px;
}

/* CORE */

#core{
    position:absolute;
    width:120px;
    height:120px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            white 0%,
            #00eaff 15%,
            #7c5cff 45%,
            #160b42 70%
        );

    box-shadow:
        0 0 25px #00eaff,
        0 0 60px #7c5cff;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    font-weight:bold;
    font-size:12px;
}

/* PLANETS */

.planet{
    position:absolute;

    width:65px;
    height:65px;

    border-radius:50%;

    border:2px solid white;

    color:white;

    font-size:9px;
    font-weight:bold;

    cursor:pointer;

    z-index:15;

    transform:translate(-50%,-50%);

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    box-shadow:0 0 20px currentColor;
}

.planet:active{
    transform:translate(-50%,-50%) scale(.8);
}

#dreams{
    background:#663cff;
}

#thoughts{
    background:#008cff;
}

#emotions{
    background:#ff3b81;
}

#memories{
    background:#ff9d00;
}

#creativity{
    background:#00bd68;
}

#unknown{
    background:#9b4dff;
}

/* BOTTOM BUTTONS */

#controls{
    position:absolute;
    bottom:12px;
    left:0;
    width:100%;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;

    gap:7px;

    padding:5px;

    z-index:50;
}

.control{
    background:#11152d;
    color:white;

    border:1px solid #555b85;

    border-radius:10px;

    padding:11px 13px;

    font-size:11px;
    font-weight:bold;

    cursor:pointer;
}

.control:active{
    background:#7c5cff;
    transform:scale(.9);
}

/* MESSAGE */

#message{
    position:absolute;

    top:55px;
    left:50%;

    transform:translateX(-50%);

    width:90%;
    max-width:400px;

    background:#10142c;

    border:2px solid #00eaff;

    border-radius:12px;

    padding:12px;

    text-align:center;

    display:none;

    z-index:100;
}

/* POPUP */

#popup{
    position:absolute;

    inset:0;

    background:rgba(0,0,0,.8);

    display:none;

    align-items:center;
    justify-content:center
