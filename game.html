<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Émìxs Game</title>

<style>
body{
    margin:0;
    background:#05051a;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

#game{
    max-width:500px;
    margin:40px auto;
    padding:20px;
}

h1{
    color:#00ffff;
}

.card{
    background:#111633;
    padding:25px;
    border-radius:15px;
    margin-top:20px;
}

button{
    display:block;
    width:100%;
    padding:15px;
    margin:10px 0;
    border:0;
    border-radius:10px;
    background:#303b80;
    color:white;
    font-size:16px;
}

button:active{
    background:#704cff;
}

#score{
    color:#00ffff;
    font-size:20px;
}
</style>
</head>

<body>

<div id="game">

<h1>🧠 ÉMÌXS MIND GAME</h1>

<p>Welcome to your first game!</p>

<div class="card">

<h2 id="question">What is 5 + 5?</h2>

<button onclick="answer(10)">10</button>
<button onclick="answer(15)">15</button>
<button onclick="answer(20)">20</button>

<p id="result"></p>

<p id="score">Score: 0</p>

</div>

</div>

<script>

let score = 0;

function answer(number){

    if(number === 10){

        score += 100;

        document.getElementById("result").innerHTML =
        "✅ Correct!";

    }else{

        document.getElementById("result").innerHTML =
        "❌ Wrong!";

    }

    document.getElementById("score").innerHTML =
    "Score: " + score;

}

</script>

</body>
</html>
