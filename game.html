<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉMÌXS Mind Game</title>

<style>

body{
    margin:0;
    min-height:100vh;
    background:#05051a;

}

#game{
    max-width:500px;

}

.card{

    box-shadow:0 0 20px #10164d;
}

button{
    display:block;
    width:100%;
    padding:16px;
    margin:12px 0;

    border-radius:12px;

    color:white;
    font-size:17px;
    font-weight:bold;
}

button:active{
    transform:scale(.94);
    background:#704cff;
}

#startSound{
    background:#00a884;

#soundButton{
    background:#222852;
    font-size:14px;
}

#result{
    min-height:30px;

#score{

}

</style>
</head>
